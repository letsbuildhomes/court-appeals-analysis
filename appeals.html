<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Municipal housing appeals</title><link rel="stylesheet" href="/appeals.css"><script src="/appeal_controls.js" defer></script><script src="/appeals.js" defer></script></head>
<body>
<header class="app-header"><a class="brand" href="/" id="brand"><span class="brand-mark" aria-hidden="true">M</span>Municipal housing appeals</a><div class="run-control"><label for="run">View</label><select id="run"><option value="all">All archive groups</option></select><button id="refresh" title="Refresh data" aria-label="Refresh data">↻</button></div></header>
<main><div id="error" class="alert error" role="alert" hidden></div>
<section id="overview">
<div class="page-heading"><div><h1>Document groups</h1><p class="muted" id="population">Loading groups…</p></div><span class="live" id="freshness">Connecting</span></div>
<section class="progress-panel" aria-label="Pipeline progress"><div class="progress-top"><div><strong id="progressTitle">Loading progress</strong><span id="progressContext" class="muted"></span></div><span id="progressCount"></span></div><progress id="progress" value="0" max="1" aria-label="Completed groups"></progress><div class="progress-bottom"><div id="stageCounts"></div><span id="cost" class="muted"></span></div></section>
<section id="usageTracker" class="usage-tracker" aria-label="Live API cost and tokens"><div id="usageMetrics" class="usage-metrics" aria-live="polite"></div></section>
<section id="researchStats" class="research-stats" aria-label="Live research results"><p class="muted">Loading research summaries…</p></section>
<div class="table-tools"><input id="search" type="search" aria-label="Search groups" placeholder="Search docket, project, municipality, or appellant"><select id="statusFilter" aria-label="Filter processing status"><option value="all">All processing statuses</option><option value="complete">Complete</option><option value="active">Processing</option><option value="waiting">Waiting / not planned</option><option value="attention">Processing issues</option><option value="review">Research review flags</option></select><select id="scopeFilter" aria-label="Filter research scope"><option value="all">All research scopes</option><option value="confirmed">Confirmed housing appeals</option><option value="uncertain">Uncertain scope</option><option value="excluded">Outside scope</option><option value="unassessed">Not assessed</option></select></div>
<div class="table-frame"><table aria-label="Document groups"><thead><tr><th><button id="sortName" class="sort" aria-label="Sort by docket">Group / project <span id="sortArrow">↑</span></button></th><th>Documents</th><th>Processing</th><th>Research scope</th><th class="optional-column">Municipality</th><th><span class="sr-only">Open group</span></th></tr></thead><tbody id="groupRows"></tbody></table></div>
<div class="pagination"><span id="pageInfo" class="muted"></span><div><label for="pageSize">Rows</label><select id="pageSize"><option>25</option><option>50</option><option>100</option></select><button id="prev">← Previous</button><span id="pageNumber"></span><button id="next">Next →</button></div></div>
</section><section id="detail" hidden aria-label="Group research results"></section></main>
<div id="scrim" hidden></div><aside id="source" hidden role="dialog" aria-modal="true" aria-label="Source evidence"><div class="drawer-head"><div><span class="eyebrow">Source evidence</span><h2 id="sourceTitle"></h2></div><button id="closeSource" aria-label="Close evidence">✕</button></div><p id="sourceProject" class="muted"></p><div id="evidenceBody"></div><section id="sourcePreview" hidden class="source-page"><h3 id="pageTitle"></h3><pre id="pageText"></pre></section></aside>
</body></html>
