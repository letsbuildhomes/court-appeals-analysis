<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group runs · Court review</title>
  <style>
    :root { --bg:#f4f6f2; --paper:#fffefa; --ink:#1e302d; --muted:#61736d; --line:#dbe3db; --accent:#1b6e5d; --warning:#92512c; --warn-bg:#fff1e2; --shadow:0 8px 30px #243a2b12; }
    * { box-sizing:border-box; }
    [hidden] { display:none!important; }
    html,body { margin:0; height:100%; }
    body { background:var(--bg); color:var(--ink); font:14px/1.48 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,select { font:inherit; }
    button { cursor:pointer; }
    a { color:var(--accent); }
    .app { height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
    .topbar { flex:none; height:58px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 23px; background:var(--paper); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:750; letter-spacing:-.02em; white-space:nowrap; }
    .brandmark { display:grid; place-items:center; width:27px; height:27px; border-radius:8px; background:var(--accent); color:white; font-family:Georgia,serif; font-size:18px; }
    .crumbs { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); min-width:0; overflow:hidden; white-space:nowrap; }
    .crumbs button { border:0; background:none; padding:0; color:var(--accent); font-weight:700; }
    .main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr); }
    .main.with-source { grid-template-columns:minmax(480px,1.1fr) minmax(400px,.9fr); }
    .column { min-height:0; overflow:auto; padding:24px min(3vw,34px) 50px; }
    .content { max-width:1120px; margin:auto; }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { font-size:27px; letter-spacing:-.045em; line-height:1.15; margin:6px 0 8px; }
    h2 { font-size:15px; letter-spacing:-.02em; margin:0; }
    h3 { font-size:15px; letter-spacing:-.02em; margin:0; }
    p { margin:0; }
    .lede { color:var(--muted); margin-bottom:18px; }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px; margin:10px 0; }
    .sectionhead { display:flex; align-items:center; gap:8px; margin:22px 0 8px; }
    .count { border-radius:99px; background:#e7eee7; color:#4b6759; font-size:11px; font-weight:750; padding:2px 7px; }
    .tablewrap { overflow:auto; border:1px solid var(--line); border-radius:12px; background:var(--paper); box-shadow:var(--shadow); }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; color:var(--muted); background:#f8faf7; padding:9px 12px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
    td { border-top:1px solid #e9eee8; padding:10px 12px; vertical-align:top; font-size:12.5px; }
    tr.click { cursor:pointer; }
    tr.click:hover { background:#f5faf6; }
    .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .muted { color:var(--muted); }
    .small { font-size:11px; }
    .badge { display:inline-block; border-radius:5px; background:#edf3ed; color:#35624b; padding:1px 6px; font-size:10.5px; font-weight:750; white-space:nowrap; margin:1px 2px 1px 0; }
    .badge.ok,.badge.extract,.badge.yes,.badge.agree { background:#e3f2e9; color:#17634c; }
    .badge.cached { background:#e8eef7; color:#335a86; }
    .badge.out_of_scope,.badge.no,.badge.no_members,.badge.too_large,.badge.skipped { background:#f1ece6; color:#7a5a3a; }
    .badge.failed,.badge.invalid_output,.badge.api_error,.badge.uncertain_delivery,.badge.disagree,.badge.none,.badge.flag { background:var(--warn-bg); color:var(--warning); }
    .badge.unclear,.badge.listing_only,.badge.caption_extra,.badge.caption_fewer,.badge.caption_only,.badge.linked { background:#f7f1dc; color:#76621d; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:12px 0; }
    .stat { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 13px; }
    .stat strong { display:block; font-size:19px; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
    .stat span { color:var(--muted); font-size:11px; }
    .key { color:var(--muted); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
    .row { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
    .spread { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .process { border:1px solid #cddfd0; border-radius:11px; background:var(--paper); padding:14px 16px; margin:10px 0; }
    .subhead { margin:14px 0 6px; padding-top:10px; border-top:1px solid var(--line); font-size:11.5px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:.055em; }
    .event { display:grid; grid-template-columns:92px minmax(0,1fr); gap:10px; padding:7px 0; border-bottom:1px solid #edf1eb; }
    .event:last-child { border-bottom:0; }
    .date { font-size:11px; font-weight:750; color:#48715a; font-variant-numeric:tabular-nums; }
    .item { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:5px 0; background:white; font-size:12.5px; }
    .item .title { font-weight:700; }
    .note { background:#f9faf7; border:1px solid var(--line); border-radius:7px; padding:7px 10px; margin:5px 0; font-size:12px; }
    .sources { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
    .sourcebtn { border:1px solid #bdd7c2; background:#f0f7ef; color:#246d4f; border-radius:5px; padding:1px 6px; font-size:10.5px; font-weight:750; white-space:nowrap; }
    .sourcebtn:hover { background:#dfeddf; }
    .warnings { background:var(--warn-bg); border:1px solid #ecd7c4; border-radius:9px; padding:8px 14px 8px 28px; color:#714b33; font-size:12px; margin:6px 0; }
    details summary { cursor:pointer; color:var(--accent); font-size:11px; font-weight:700; }
    pre { max-height:420px; overflow:auto; margin:6px 0 0; padding:10px; border:1px solid var(--line); border-radius:6px; background:#f5f7f4; color:#304039; font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre-wrap; }
    .smallbtn { background:white; border:1px solid var(--line); border-radius:7px; padding:5px 10px; color:var(--ink); font-weight:600; font-size:12px; }
    .source-pane { display:none; min-height:0; flex-direction:column; border-left:1px solid var(--line); background:#e6ebe6; }
    .main.with-source .source-pane { display:flex; }
    .source-toolbar { flex:none; display:flex; align-items:center; gap:7px; padding:10px 12px; background:var(--paper); border-bottom:1px solid var(--line); }
    .source-toolbar strong { margin-right:auto; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .source-quote { flex:none; background:#f4f7f2; border-bottom:1px solid var(--line); padding:8px 14px; color:#52675d; font:12px/1.38 Georgia,serif; max-height:75px; overflow:auto; }
    .source-canvas { flex:1; min-height:0; display:grid; place-items:center; overflow:auto; padding:11px; }
    .source-canvas img { display:block; max-width:100%; max-height:100%; object-fit:contain; box-shadow:0 3px 15px #13231d3b; background:white; }
    .empty { color:var(--muted); padding:28px; text-align:center; }
    @media (max-width:920px) { .stats { grid-template-columns:repeat(2,minmax(0,1fr)); } .main.with-source { grid-template-columns:1fr; grid-template-rows:minmax(280px,1fr) minmax(300px,1fr); } .source-pane { border-left:0; border-top:1px solid var(--line); } .grid2 { grid-template-columns:1fr; } .column { padding:18px 14px; } }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><span class="brandmark">§</span> Group runs</div><nav class="crumbs" id="crumbs"></nav><a class="small" href="/">Claims explorer →</a></header>
  <div class="main" id="main">
    <div class="column"><div class="content" id="content"><div class="empty">Loading…</div></div></div>
    <aside class="source-pane" aria-label="Source PDF page"><div class="source-toolbar"><strong id="sourceTitle">Source page</strong><button class="smallbtn" id="prevSource" type="button">←</button><button class="smallbtn" id="nextSource" type="button">→</button><button class="smallbtn" id="openPdf" type="button">PDF ↗</button><button class="smallbtn" id="closeSource" type="button">Close</button></div><div class="source-quote" id="sourceQuote"></div><div class="source-canvas"><span id="sourceMessage" class="muted small">Choose a source.</span><img id="sourceImage" alt="Rendered PDF page" hidden></div></aside>
  </div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const el = (tag, cls='', text=null) => { const e=document.createElement(tag); if(cls)e.className=cls; if(text!==null&&text!==undefined)e.textContent=String(text); return e; };
  const plain = v => String(v ?? '').replaceAll('_',' ');
  const n = v => v==null ? '—' : Number(v).toLocaleString();
  const badge = (value, cls=value) => el('span', `badge ${cls||''}`, plain(value));
  const params = () => new URL(location.href).searchParams;
  let group=null, source={doc:0,page:0};

  function go(next) {
    const url=new URL(location.href); url.search='';
    for(const [k,v] of Object.entries(next)) if(v!=null&&v!=='') url.searchParams.set(k,v);
    history.pushState(null,'',url); route();
  }
  function crumbs(parts) {
    const nav=$('crumbs'); nav.replaceChildren();
    parts.forEach(([label,target],i)=>{ if(i)nav.append(el('span','','/')); if(target){const b=el('button','',label);b.type='button';b.onclick=()=>go(target);nav.append(b);} else nav.append(el('span','',label)); });
  }
  async function getJSON(url) { const r=await fetch(url), d=await r.json(); if(!r.ok)throw Error(d.error||'Request failed'); return d; }
  function usageLine(u) { if(!u)return 'no usage reported'; const share=u.input&&u.cached!=null?` (${Math.round(100*u.cached/u.input)}%)`:''; return `in ${n(u.input)} · cached ${n(u.cached)}${share} · out ${n(u.output)} · reasoning ${n(u.reasoning)}${u.usd!=null?` · $${u.usd.toFixed(4)}`:''}`; }
  function stat(parent,value,label) { const s=el('div','stat'); s.append(el('strong','',value),el('span','',label)); parent.append(s); }
  function jsonBlock(value,label) { const d=el('details'); d.append(el('summary','',label)); const pre=el('pre'); pre.textContent=typeof value==='string'?value:JSON.stringify(value,null,2); d.append(pre); return d; }

  // ---------------- batch list
  async function showBatches() {
    closeSource(); crumbs([['Batches']]);
    const root=$('content'); root.replaceChildren(el('div','empty','Loading batches…'));
    const data=await getJSON('/api/group-batches');
    root.replaceChildren(el('div','eyebrow','Group scouting'),el('h1','','Group batches'),el('p','lede','Each batch sends docket groups through triage, then extraction for groups triage keeps. Token counts cover requests actually sent; cached reuse is excluded.'));
    if(!data.batches.length){root.append(el('div','card empty','No group batches yet. Plan one with make group-plan.'));return;}
    const wrap=el('div','tablewrap'), table=el('table'); table.innerHTML='<thead><tr><th>Batch</th><th>Groups</th><th>Routes</th><th>Extracted</th><th class="num">Requests</th><th class="num">Input</th><th class="num">Cached</th><th class="num">Output</th><th class="num">Cost</th><th>Reasoning</th></tr></thead>';
    const body=el('tbody');
    for(const b of data.batches) {
      const tr=el('tr','click'); tr.onclick=()=>go({batch:b.batch_id});
      const name=el('td'); name.append(el('div','',b.label||b.batch_id),el('div','muted small',`${b.batch_id} · ${b.created_at.slice(0,16).replace('T',' ')}`)); tr.append(name);
      tr.append(el('td','num',b.group_count));
      const routes=el('td'); for(const [r,c] of Object.entries(b.routes))routes.append(badge(`${plain(r)} ${c}`,r)); if(!Object.keys(b.routes).length)routes.append(el('span','muted','not run')); tr.append(routes);
      tr.append(el('td','num',b.extracted));
      for(const k of ['requests','input','cached','output'])tr.append(el('td','num',n(b.usage[k])));
      tr.append(el('td','num',`$${(b.usage.usd||0).toFixed(3)}`));
      tr.append(el('td','small',`${b.reasoning.triage||'default'} / ${b.reasoning.extract||'default'}`));
      body.append(tr);
    }
    table.append(body); wrap.append(table); root.append(wrap);
  }

  // ---------------- one batch
  async function showBatch(batchId) {
    closeSource(); crumbs([['Batches',{}],[batchId]]);
    const root=$('content'); root.replaceChildren(el('div','empty','Loading batch…'));
    const b=await getJSON(`/api/group-batch?batch=${encodeURIComponent(batchId)}`);
    root.replaceChildren(el('div','eyebrow','Group batch'),el('h1','',b.label||b.batch_id));
    root.append(el('div','small muted',[b.batch_id,`grouping ${b.grouping_version}`,`triage reasoning ${b.reasoning.triage||'default'}`,`extract reasoning ${b.reasoning.extract||'default'}`,`size limit ${n(b.max_chars)} chars`].join(' · ')));
    const stats=el('div','stats');
    for(const step of ['triage','extract']) { const u=b.usage[step]; stat(stats,n(u.requests),`${step} requests sent`); stat(stats,n(u.input),`${step} input tokens`); stat(stats,u.input?`${Math.round(100*u.cached/u.input)}%`:'—',`${step} input cached`); stat(stats,n(u.output),`${step} output (reasoning ${n(u.reasoning)}) · $${(u.usd||0).toFixed(4)}`); }
    root.append(stats);
    const head=el('div','sectionhead'); head.append(el('h2','','Groups'),el('span','count',b.groups.length)); root.append(head);
    const wrap=el('div','tablewrap'), table=el('table'); table.innerHTML='<thead><tr><th>#</th><th>Group</th><th>Composition</th><th>Triage</th><th>Extraction</th><th class="num">Tokens (in / cached / out)</th></tr></thead>';
    const body=el('tbody');
    for(const g of b.groups) {
      const tr=el('tr','click'); tr.onclick=()=>go({batch:batchId,group:g.group_id});
      tr.append(el('td','muted',g.ordinal));
      const name=el('td'); name.append(el('div','',g.group_id),el('div','muted small',g.dockets.join(', '))); if(g.note)name.append(el('div','small',g.note)); tr.append(name);
      const comp=el('td'); comp.append(badge(g.composition),el('div','muted small',`${g.doc_count} PDFs · ${n(g.text_chars)} chars`)); if(g.weak_documents)comp.append(badge(`${g.weak_documents} weak`,'flag')); tr.append(comp);
      const t=g.steps.triage, e=g.steps.extract;
      const tri=el('td'); if(t){tri.append(badge(t.status),t.route?badge(t.route):''); if(t.route_detail&&t.route_detail.municipal_appeal)tri.append(el('div','small muted',`${t.route_detail.case_type?plain(t.route_detail.case_type)+' · ':''}${t.route_detail.development?plain(t.route_detail.development)+' · ':''}municipal ${t.route_detail.municipal_appeal} · housing ${t.route_detail.housing}${t.route_detail.excluded_docs?.length?` · excluded ${t.route_detail.excluded_docs.join(', ')}`:''}`)); if(t.matter)tri.append(el('div','small',t.matter)); if(t.error)tri.append(el('div','small',t.error));} else tri.append(el('span','muted','not run')); tr.append(tri);
      const ext=el('td'); if(e){ext.append(badge(e.status)); if(e.counts)ext.append(el('div','small muted',Object.entries(e.counts).map(([k,v])=>`${v} ${k}`).join(' · '))); if(e.warning_count)ext.append(badge(`${e.warning_count} warnings`,'flag')); if(e.error)ext.append(el('div','small',e.error));} else ext.append(el('span','muted','—')); tr.append(ext);
      const tok=el('td','num small'); for(const [label,turn] of [['T',t],['E',e]])if(turn&&turn.usage)tok.append(el('div','',`${label}: ${n(turn.usage.input)} / ${n(turn.usage.cached)} / ${n(turn.usage.output)}${turn.status==='cached'?' (reused)':''}`)); tr.append(tok);
      body.append(tr);
    }
    table.append(body); wrap.append(table); root.append(wrap);
    if(b.runs.length) {
      const rh=el('div','sectionhead'); rh.append(el('h2','','Runs'),el('span','count',b.runs.length)); root.append(rh);
      for(const r of b.runs) { const card=el('div','card small'); card.append(el('div','',`${r.started_at.slice(0,19).replace('T',' ')} → ${r.finished_at?r.finished_at.slice(11,19):'unfinished'} · ${r.model} · ${r.endpoint}`),el('div','muted',`${r.requested} requests · ${r.cached} cached turns · ${r.failed} failures`)); for(const step of ['triage','extract'])card.append(el('div','',`${step}: ${r.steps[step].requests} requests · ${usageLine(r.steps[step])}`)); root.append(card); }
    }
  }

  // ---------------- one group
  function sources(parent, evidence) {
    if(!Array.isArray(evidence)||!evidence.length)return;
    const row=el('div','sources');
    for(const c of evidence){ const b=el('button','sourcebtn',`doc ${c.doc} · p. ${c.page}`); b.type='button'; b.title=c.quote||''; b.onclick=()=>showSource(Number(c.doc),Number(c.page),c.quote||''); row.append(b); }
    const d=el('details'); d.append(el('summary','','quotes')); for(const c of evidence)d.append(el('div','note',`doc ${c.doc} p. ${c.page}: “${c.quote||''}”`)); row.append(d); parent.append(row);
  }
  function renderTriage(root, triage, docs) {
    const card=el('div','card'); const top=el('div','spread'); top.append(el('h3','','Triage'));
    const r=el('div','row'); if(triage.case_type)r.append(badge(triage.case_type,'')); if(triage.development)r.append(badge(triage.development,'')); r.append(el('span','key','municipal appeal'),badge(triage.municipal_appeal),el('span','key','housing'),badge(triage.housing)); top.append(r); card.append(top);
    if(triage.matter)card.append(el('p','',triage.matter)); if(triage.reason)card.append(el('p','muted small',triage.reason));
    sources(card,triage.evidence); card.append(jsonBlock(triage,'triage JSON')); root.append(card);
  }
  function renderEvent(ev) {
    const row=el('div','event'); row.append(el('div','date',ev.date||'date unknown'));
    const body=el('div'), title=el('div','row'); title.append(el('strong','small',plain(ev.kind||'event'))); for(const d of ev.dockets||(ev.docket?[ev.docket]:[]))title.append(badge(d,'')); if(ev.outcome)title.append(badge(ev.outcome,'')); if(ev.final===true)title.append(badge('final','ok')); if(ev.mechanism)title.append(badge(ev.mechanism,'')); body.append(title);
    body.append(el('div','small',ev.summary||''));
    if(ev.conditions)body.append(el('div','small muted',`Conditions: ${ev.conditions}`));
    for(const eff of ev.effects||[])body.append(el('div','note',`Effect on ${plain(eff.measure)}: ${plain(eff.change)}${eff.from!=null||eff.to!=null?` (${eff.from??'?'} → ${eff.to??'?'})`:''} — ${eff.summary||''}`));
    sources(body,ev.evidence); row.append(body); return row;
  }
  function nestFlat(x) {
    // V4.1 lists items at the top level with p = 1-based process position.
    if(!['v4.1','v4.2','v4.3','v4.4','v4.5','v4.6','v4.7','v4.8','v4.9','v4.10'].includes(x.schema_version))return x;
    const processes=(x.processes||[]).map(p=>({...p,events:[],participants:[],grounds:[],remarks:[]}));
    const orphan={level:'other',body:'Items without a valid process',events:[],participants:[],grounds:[],remarks:[]};
    for(const key of ['events','participants','grounds','remarks'])for(const item of x[key]||[]){const target=processes[(item.p||0)-1]||orphan; target[key].push(item);}
    if(['events','participants','grounds','remarks'].some(k=>orphan[k].length))processes.push(orphan);
    return {...x,processes};
  }
  function renderExtraction(root, x) {
    if(x.schema_version==='v5') {
      for(const record of x.dockets||[]) {
        const card=el('div','card'); card.append(el('h3','',record.docket||'Docket unknown'));
        for(const [key,value] of Object.entries(record)) {
          if(key==='docket')continue;
          card.append(el('div','subhead',plain(key)));
          for(const item of (Array.isArray(value)?value:[value])) {
            const box=el('div','item');
            for(const [field,v] of Object.entries(item||{})) {
              if(field.endsWith('evidence'))continue;
              box.append(el('div','small',`${plain(field)}: ${v===null?'unknown':Array.isArray(v)?v.join(', '):v}`));
            }
            sources(box,item?.evidence);
            if(item?.central_evidence?.length){box.append(el('div','key','Centrality evidence'));sources(box,item.central_evidence);}
            card.append(box);
          }
        }
        card.append(jsonBlock(record,'Docket JSON'));root.append(card);
      }
      if(x.scouting)root.append(jsonBlock(x.scouting,'Scouting feedback (not research data)'));
      return;
    }
    x=nestFlat(x);
    if(x.project) { const p=x.project, card=el('div','card'); card.append(el('div','key','Project'),el('h3','',p.summary||'')); const r=el('div','row small'); for(const [k,v] of [['municipality',p.municipality],['address',p.address],['units',p.units],['lots',p.lots]])if(v!=null&&v!==''){r.append(el('span','key',k),el('span','',v));} card.append(r); sources(card,p.evidence); root.append(card); }
    else root.append(el('div','card muted','No project returned.'));
    for(const [i,pr] of (x.processes||[]).entries()) {
      const box=el('div','process'); const head=el('div','spread'); const h=el('div'); h.append(el('div','key',`Process ${i+1} · ${plain(pr.level)}`),el('h3','',pr.body||'')); head.append(h);
      const r=el('div','row'); for(const d of pr.dockets||[])r.append(badge(d,'')); head.append(r); box.append(head);
      if(pr.applicant)box.append(el('div','small',`Applicant: ${pr.applicant}`));
      if(pr.events?.length){box.append(el('div','subhead',`Timeline · ${pr.events.length}`)); for(const ev of pr.events)box.append(renderEvent(ev));}
      if(pr.participants?.length){box.append(el('div','subhead',`Participants · ${pr.participants.length}`)); const g=el('div','grid2'); for(const pp of pr.participants){const it=el('div','item'); it.append(el('div','title',pp.name||'')); const r2=el('div','row'); for(const role of pp.roles||[])r2.append(badge(role,'')); r2.append(badge(pp.relation,'')); if(pp.counsel)r2.append(badge(pp.counsel,pp.counsel==='pro_se'?'unclear':'ok')); it.append(r2); if(pp.members?.length)it.append(el('div','small muted',`Members: ${pp.members.join(', ')}`)); if(pp.attorneys?.length)it.append(el('div','small muted',`Attorneys: ${pp.attorneys.join(', ')}`)); sources(it,pp.evidence); g.append(it);} box.append(g);}
      if(pr.grounds?.length){box.append(el('div','subhead',`Grounds · ${pr.grounds.length}`)); for(const gr of pr.grounds){const it=el('div','item'); const r2=el('div','row'); r2.append(badge(gr.topic,''),badge(gr.category,''),badge(gr.result,gr.result==='succeeded'?'ok':'')); if(gr.applies===false)r2.append(badge('does not apply','flag')); if(gr.raised_by)r2.append(el('span','small muted',`raised by ${gr.raised_by}`)); it.append(r2,el('div','',gr.summary||'')); if(gr.reason)it.append(el('div','small muted',`Why: ${gr.reason}`)); sources(it,gr.evidence); box.append(it);}}
      if(pr.remarks?.length){box.append(el('div','subhead',`Court remarks · ${pr.remarks.length}`)); for(const rm of pr.remarks){const it=el('div','item'); it.append(badge(rm.kind,'flag'),el('span','small',` ${rm.target?rm.target+': ':''}${rm.summary||''}`)); sources(it,rm.evidence); box.append(it);}}
      box.append(jsonBlock(pr,'process JSON')); root.append(box);
    }
    for(const [key,label] of [['uncertainties','Uncertainties'],['suggestions','Suggestions']]) { const items=x[key]||[]; if(!items.length)continue; const h=el('div','sectionhead'); h.append(el('h2','',label),el('span','count',items.length)); root.append(h); for(const it of items)root.append(el('div','note',typeof it==='string'?it:`${it.idea||''}${it.why?` — ${it.why}`:''}`)); }
  }
  function renderTurns(root, turns) {
    const h=el('div','sectionhead'); h.append(el('h2','','Turns'),el('span','count',turns.length)); root.append(h);
    for(const t of turns) {
      const card=el('div','card small'); const top=el('div','row'); top.append(el('strong','',t.step),badge(t.status)); if(t.route)top.append(badge(t.route.route)); top.append(el('span','muted',`${t.attempted_at.slice(0,19).replace('T',' ')} · ${t.model} · reasoning ${t.reasoning||'default'}${t.elapsed?` · ${t.elapsed.toFixed(1)}s`:''}${t.finish_reason?` · ${t.finish_reason}`:''}`)); card.append(top);
      card.append(el('div','',`${usageLine(t.usage)}${t.status==='cached'?' — original usage of a reused turn; no new request':''}`));
      if(t.request_chars)card.append(el('div','muted',`request ${n(t.request_chars)} JSON characters`));
      if(t.error)card.append(el('div','warnings',t.error));
      if(t.warnings.length){const list=el('ul','warnings'); for(const w of t.warnings)list.append(el('li','',w)); card.append(list);}
      if(t.response_text)card.append(jsonBlock(t.response_text,'raw response'));
      root.append(card);
    }
  }
  async function showGroup(batchId, groupId) {
    crumbs([['Batches',{}],[batchId,{batch:batchId}],[groupId]]);
    const root=$('content'); root.replaceChildren(el('div','empty','Loading group…'));
    const g=await getJSON(`/api/group-result?batch=${encodeURIComponent(batchId)}&group=${encodeURIComponent(groupId)}`); group=g;
    const latest=step=>[...g.turns].reverse().find(t=>t.step===step&&['ok','cached'].includes(t.status));
    const triage=latest('triage')?.parsed, extract=latest('extract')?.parsed;
    root.replaceChildren(el('div','eyebrow',`Group ${g.ordinal} · ${g.composition}`),el('h1','',g.group_id));
    const meta=el('div','row'); for(const d of g.dockets)meta.append(badge(d,'')); meta.append(el('span','small muted',`${g.documents.length} PDFs · ${n(g.text_chars)} characters`)); root.append(meta);
    if(g.note)root.append(el('p','small',`Selected because: ${g.note}`));
    const h=el('div','sectionhead'); h.append(el('h2','','Documents & membership'),el('span','count',g.documents.length)); root.append(h);
    const belongs=Object.fromEntries((triage?.documents||[]).map(d=>[d.doc,d]));
    const wrap=el('div','tablewrap'), table=el('table'); table.innerHTML='<thead><tr><th>Doc</th><th>Listing title / posted</th><th>Basis</th><th>Caption dockets</th><th>Listing dockets</th><th>Triage</th></tr></thead>';
    const body=el('tbody');
    for(const d of g.documents) {
      const tr=el('tr','click'); tr.onclick=()=>showSource(d.doc,1,'');
      tr.append(el('td','',d.doc));
      const title=el('td'); title.append(el('div','',d.title||'—'),el('div','small muted',`${(d.posted||'').slice(0,10)} · ${d.pages} pages · ${d.sha.slice(0,10)}`)); tr.append(title);
      const basis=el('td'); basis.append(badge(d.basis)); for(const f of d.flags)basis.append(badge(f,'flag')); tr.append(basis);
      tr.append(el('td','small',d.caption_dockets.join(', ')||'—'),el('td','small',d.listing_dockets.join(', ')||'—'));
      const tri=el('td'), b=belongs[d.doc]; if(b){tri.append(badge(b.belongs)); if(b.date)tri.append(el('div','small muted',b.date)); if(b.caption_dockets?.length)tri.append(el('div','small muted',b.caption_dockets.join(', '))); if(b.note)tri.append(el('div','small',b.note));} else tri.append(el('span','muted','—')); tr.append(tri);
      body.append(tr);
    }
    table.append(body); wrap.append(table); root.append(wrap);
    if(triage)renderTriage(root,triage,g.documents);
    if(extract){const eh=el('div','sectionhead'); eh.append(el('h2','','Extraction')); root.append(eh); renderExtraction(root,extract); root.append(jsonBlock(extract,'full extraction JSON'));}
    renderTurns(root,g.turns);
    const p=params(); if(p.get('doc')&&p.get('page'))showSource(Number(p.get('doc')),Number(p.get('page')),'',false);
  }

  // ---------------- source pane
  function showSource(doc,page,quote,push=true) {
    const d=group?.documents.find(x=>x.doc===doc); if(!d||page<1||page>d.pages)return;
    source={doc,page}; $('main').classList.add('with-source');
    $('sourceTitle').textContent=`Doc ${doc} · page ${page} of ${d.pages} · ${d.title||d.sha.slice(0,12)}`;
    $('prevSource').disabled=page<=1; $('nextSource').disabled=page>=d.pages;
    $('sourceQuote').textContent=quote?`Evidence quote: “${quote}”`:'Browsing PDF page';
    const img=$('sourceImage'); img.hidden=true; $('sourceMessage').hidden=false; $('sourceMessage').textContent='Rendering PDF page…';
    img.onload=()=>{img.hidden=false;$('sourceMessage').hidden=true;}; img.onerror=()=>{$('sourceMessage').textContent='Could not render this PDF page.';};
    img.src=`/api/render?sha=${encodeURIComponent(d.sha)}&page=${page}`;
    if(push){const url=new URL(location.href);url.searchParams.set('doc',doc);url.searchParams.set('page',page);history.replaceState(null,'',url);}
  }
  function closeSource() { $('main').classList.remove('with-source'); const url=new URL(location.href); if(url.searchParams.has('page')){url.searchParams.delete('doc');url.searchParams.delete('page');history.replaceState(null,'',url);} }
  $('prevSource').onclick=()=>showSource(source.doc,source.page-1,''); $('nextSource').onclick=()=>showSource(source.doc,source.page+1,'');
  $('closeSource').onclick=closeSource;
  $('openPdf').onclick=()=>{const d=group?.documents.find(x=>x.doc===source.doc); if(d)window.open(`/api/pdf?sha=${encodeURIComponent(d.sha)}#page=${source.page}`,'_blank','noopener');};

  async function route() {
    const p=params();
    try { if(p.get('batch')&&p.get('group'))await showGroup(p.get('batch'),p.get('group')); else if(p.get('batch'))await showBatch(p.get('batch')); else await showBatches(); }
    catch(error) { $('content').replaceChildren(el('div','card empty',error.message)); }
  }
  window.onpopstate=route;
  route();
</script>
</body>
