<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Court PDF text review</title>
  <style>
    :root { color-scheme: light; --ink:#202b2a; --muted:#647471; --line:#d9e1dc; --paper:#fcfcf8; --wash:#edf2ee; --accent:#176a60; --accent-dark:#0d514a; --warn:#955124; }
    * { box-sizing:border-box; }
    body { margin:0; height:100dvh; overflow:hidden; background:var(--wash); color:var(--ink); font:12px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,select { font:inherit; }
    button { cursor:pointer; }
    .toolbar { height:40px; display:flex; align-items:center; gap:6px; padding:4px 7px; background:var(--paper); border-bottom:1px solid var(--line); }
    select,.smallbtn,.primary { flex:none; border:1px solid var(--line); border-radius:5px; padding:3px 7px; background:white; color:var(--ink); height:30px; }
    .primary { background:var(--accent); border-color:var(--accent); color:white; font-weight:700; padding:3px 11px; }
    .primary:hover { background:var(--accent-dark); }
    .smallbtn:hover,select:hover { border-color:#96aca4; }
    .smallbtn:disabled { opacity:.45; cursor:default; }
    .meta { display:flex; align-items:center; gap:4px; min-width:0; flex:1; overflow:auto hidden; white-space:nowrap; scrollbar-width:none; }
    .meta::-webkit-scrollbar { display:none; }
    .identity { flex:none; font-size:11px; color:var(--muted); padding:0 3px; }
    .pill { flex:none; display:inline-flex; border-radius:4px; padding:2px 5px; background:#e5eee8; color:#325b4e; font-size:10px; font-weight:700; }
    .pill.issue { background:#f8eada; color:var(--warn); }
    .pill.critical { background:#f5dede; color:#9a3434; }
    .workspace { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1px; background:var(--line); height:calc(100dvh - 40px); min-height:0; }
    .pane { min-width:0; min-height:0; background:var(--paper); }
    .canvas { width:100%; height:100%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#e3e8e3; padding:5px; }
    #pageImage { display:block; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; box-shadow:0 2px 12px #26383030; background:white; }
    #pageImage[hidden] { display:none; }
    .empty { color:var(--muted); text-align:center; }
    .textwrap { width:100%; height:100%; min-height:0; overflow:hidden; padding:5px 8px; }
    .textwrap.needsScroll { overflow:auto; }
    .sourceTabs { flex:none; display:flex; padding:2px; gap:1px; background:#e9efea; border-radius:5px; }
    .sourceTabs button { background:transparent; border:0; border-radius:4px; padding:4px 7px; color:#53655f; font-size:11px; font-weight:650; }
    .sourceTabs button.active { background:white; color:var(--accent-dark); box-shadow:0 1px 3px #15352720; }
    .sourceTabs button:disabled { opacity:.4; cursor:default; }
    pre { margin:0; white-space:pre-line; overflow-wrap:break-word; text-align:left; font:12px/1.12 Georgia,"Times New Roman",serif; color:#1d2925; }
    .error { color:#a13232; }
    @media (max-width:780px) { body { overflow:auto; height:auto; } .toolbar { position:sticky; top:0; z-index:2; } .workspace { display:block; height:auto; } .pane { height:calc(100dvh - 40px); } .sourceTabs button { padding-inline:4px; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <select id="mode" aria-label="Sample filter" title="Sample filter">
      <option value="native_ok">Native OK</option>
      <option value="flagged">Flagged</option>
      <option value="unresolved">Unresolved</option>
    </select>
    <button id="random" class="primary" title="Choose a random page">Random page</button>
    <button class="smallbtn" id="prev" title="Previous page in this PDF" aria-label="Previous page" disabled>←</button>
    <button class="smallbtn" id="next" title="Next page in this PDF" aria-label="Next page" disabled>→</button>
    <div class="meta" id="meta"><span class="identity">Loading page…</span></div>
    <div class="sourceTabs" role="tablist" aria-label="Text source">
      <button id="selectedTab" data-source="selected" class="active" title="Production text from current_analysis_pages">Selected</button>
      <button id="nativeTab" data-source="native">Native</button>
      <button id="ocrTab" data-source="ocr">OCR</button>
    </div>
  </div>
  <main class="workspace">
    <section class="pane" aria-label="PDF page">
      <div class="canvas" id="canvas"><div class="empty" id="imageMessage">The page image will appear here.</div><img id="pageImage" alt="Rendered court PDF page" hidden></div>
    </section>
    <section class="pane" aria-label="Extracted text">
      <div class="textwrap" id="textwrap"><pre id="textContent">Choose a page to inspect its text.</pre></div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let current = null, source = 'selected', requestId = 0;
    const labels = {
      native_ok:'Native OK', ocr_needed:'OCR needed', ocr_candidate:'OCR candidate', blank:'Blank by triage',
      short_native_text:'Short text', sparse_relative_to_document:'Sparse',
      page_sized_image:'Page image', substantial_image:'Image 20%+',
      suspicious_characters:'Bad chars', body_ink_without_native_words:'Body ink',
      poppler_output_disagreement:'Poppler mismatch', unresolved_text:'Unresolved',
      ocr_disagreement:'OCR differs', ocr_inconclusive:'OCR inconclusive',
      suspected_native_omission:'Possible omission'
    };
    function pill(text, kind='') {
      const span = document.createElement('span'); span.className = 'pill ' + kind; span.textContent = text; return span;
    }
    function fitText() {
      const viewport = $('textwrap'), text = $('textContent');
      const availableHeight = viewport.clientHeight - 10;
      const availableWidth = viewport.clientWidth - 16;
      let low = 5.5, high = 16, best = low;
      viewport.classList.remove('needsScroll');
      for (let i = 0; i < 11; i++) {
        const size = (low + high) / 2;
        text.style.fontSize = `${size}px`;
        if (text.scrollHeight <= availableHeight && text.scrollWidth <= availableWidth) {
          best = size; low = size;
        } else high = size;
      }
      text.style.fontSize = `${best}px`;
      viewport.classList.toggle('needsScroll', text.scrollHeight > availableHeight || text.scrollWidth > availableWidth);
    }
    function updateText() {
      document.querySelectorAll('.sourceTabs button').forEach(button => {
        button.classList.toggle('active', button.dataset.source === source);
        button.disabled = !current || (button.dataset.source === 'ocr' && current.ocr_text === null);
      });
      if (!current) return;
      const values = {selected:current.selected_text, native:current.native_text, ocr:current.ocr_text};
      let meta = '';
      if (source === 'selected') meta = `Selection: ${current.selected_status || 'missing'}${current.selected_source ? ' · ' + current.selected_source : ''} · ${current.selected_reason || 'no reason recorded'}`;
      if (source === 'native') meta = `Native extraction · triage: ${current.triage} · ${current.triage_reason}`;
      if (source === 'ocr') meta = `${current.ocr_origin || 'OCR'}${current.ocr_mean_confidence !== null ? ' · mean confidence ' + current.ocr_mean_confidence.toFixed(1) + '%' : ''}`;
      $('textwrap').title = meta;
      $('textContent').textContent = values[source] || (source === 'selected' ? `No selected text for this page. ${current.selected_reason || ''}` : 'No text available from this source.');
      requestAnimationFrame(fitText);
    }
    function showPage(page) {
      current = page;
      source = page.selected_status === 'unresolved'
        ? (page.ocr_text ? 'ocr' : page.native_text ? 'native' : 'selected')
        : 'selected';
      const short = page.sha.slice(0, 12);
      $('prev').disabled = page.page <= 1; $('next').disabled = page.page >= page.page_count;
      const meta = $('meta'); meta.replaceChildren();
      const identity = document.createElement('span'); identity.className = 'identity';
      identity.textContent = `${short}… · ${page.page}/${page.page_count}`; meta.append(identity);
      meta.append(pill(labels[page.triage] || page.triage));
      page.issues.filter(issue => issue !== page.triage).forEach(issue => meta.append(pill(labels[issue] || issue.replaceAll('_',' '), issue === 'suspected_native_omission' || issue === 'unresolved_text' ? 'critical' : 'issue')));
      if (page.image_count) meta.append(pill(`${page.image_count} embedded image${page.image_count === 1 ? '' : 's'}`));
      meta.title = `PDF ${page.sha}, page ${page.page}/${page.page_count}. ${page.issues.join(', ') || 'No QA flags'}. Selected: ${page.selected_source || page.selected_status || 'unavailable'}`;
      $('pageImage').hidden = true; $('imageMessage').hidden = false; $('imageMessage').textContent = 'Rendering page…';
      $('pageImage').src = `/api/render?sha=${page.sha}&page=${page.page}`;
      $('pageImage').onload = () => { $('pageImage').hidden = false; $('imageMessage').hidden = true; };
      $('pageImage').onerror = () => { $('pageImage').hidden = true; $('imageMessage').hidden = false; $('imageMessage').textContent = 'Could not render this page.'; };
      updateText();
      const url = new URL(location.href); url.searchParams.set('sha', page.sha); url.searchParams.set('page', page.page); url.searchParams.set('mode', $('mode').value); history.replaceState(null, '', url);
    }
    async function load(url) {
      const myRequest = ++requestId;
      $('random').disabled = true; $('random').textContent = 'Loading…';
      try {
        const response = await fetch(url);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Request failed');
        if (myRequest === requestId) showPage(data);
      } catch (error) {
        if (myRequest === requestId) {
          const meta = $('meta'); meta.replaceChildren();
          const message = document.createElement('span'); message.className = 'identity error'; message.textContent = error.message; meta.append(message);
        }
      } finally {
        if (myRequest === requestId) { $('random').disabled = false; $('random').textContent = 'Random page'; }
      }
    }
    $('random').addEventListener('click', () => load(`/api/random?mode=${encodeURIComponent($('mode').value)}`));
    $('mode').addEventListener('change', () => { const url = new URL(location.href); url.searchParams.set('mode', $('mode').value); history.replaceState(null, '', url); });
    $('prev').addEventListener('click', () => current && current.page > 1 && load(`/api/page?sha=${current.sha}&page=${current.page - 1}`));
    $('next').addEventListener('click', () => current && current.page < current.page_count && load(`/api/page?sha=${current.sha}&page=${current.page + 1}`));
    document.querySelectorAll('.sourceTabs button').forEach(button => button.addEventListener('click', () => { source = button.dataset.source; updateText(); }));
    window.addEventListener('resize', () => requestAnimationFrame(fitText));
    const params = new URLSearchParams(location.search);
    if (['flagged', 'unresolved'].includes(params.get('mode'))) $('mode').value = params.get('mode');
    if (params.has('sha') && params.has('page')) load(`/api/page?sha=${encodeURIComponent(params.get('sha'))}&page=${encodeURIComponent(params.get('page'))}`);
    else load(`/api/random?mode=${$('mode').value}`);
  </script>
</body>
</html>
